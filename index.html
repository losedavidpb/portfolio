<!DOCTYPE html>
<html lang="en" data-environment="development">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title data-i18n="site.title"></title>
    <meta name="description" content="" data-i18n-attr="content:site.description" />
    <meta name="author" content="" data-i18n-attr="content:site.author" />

    <link rel="canonical" href="" />

    <link rel="alternate" hreflang="es" href="" />
    <link rel="alternate" hreflang="en" href="" />
    <link rel="alternate" hreflang="x-default" href="" />

    <meta name="google-site-verification" content="JOO4joSA4NevMASQPV2XWKz10Mcm7z_lpbDb0yRkDKk" />

    <link rel="icon" type="image/x-icon" href="./assets/images/favicon.ico">

    <!-- https://www.bootstrapcdn.com/ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <!-- https://www.bootstrapcdn.com/bootstrapicons/ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.2/font/bootstrap-icons.css"
        integrity="sha384-b6lVK+yci+bfDmaY1u0zE8YYJt0TZxLEAFyYSLHId4xoVvsrQu3INevFKo+Xir8e" crossorigin="anonymous">

    <link rel="stylesheet" href="./assets/css/style.css">

    <!-- https://developers.google.com/speed/libraries -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>

    <!-- https://www.bootstrapcdn.com/ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous">
        </script>

    <!-- local -->
    <script type="module" src="./assets/js/main.js"></script>
</head>

<body class="bg-light text-dark">
    <div class="background" id="background-image">

        <!-- Language selector -->
        <div class="list-group list-group-horizontal position-absolute top-0 start-0 m-4 shadow-sm rounded-3 overflow-hidden" id="language-div">
            <a class="list-group-item list-group-item-action flex-fill border-0 px-3 py-2" href="?lang=es" data-language="es">
                <span class="fw-bold">ES</span>
            </a>
            <a class="list-group-item list-group-item-action flex-fill border-0 px-3 py-2" href="?lang=en" data-language="en">
                <span class="fw-bold">EN</span>
            </a>
        </div>

        <!-- Header -->
        <header class="container mt-5 pt-5 pb-3 d-flex align-items-center justify-content-between" id="home">
            <div class="d-inline-flex align-items-center px-4 py-3 bg-white border shadow-lg rounded-4">
                <span class="text-dark fs-1 fw-bold person-header" data-i18n="site.name"></span>
            </div>
        </header>

        <!-- Loading spinner -->
        <div id="loader"
            class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center fade show background-spinner">
            <div class="bg-white rounded-4 shadow-lg d-flex flex-column align-items-center loader-box">
                <div class="spinner-border text-primary mb-4 spinner-xl" role="status"></div>
                <span class="text-primary fw-semibold loader-text" id="loading-text" data-i18n="site.loading"></span>
            </div>
        </div>

        <!-- Main content -->
        <div class="container py-4" id="main-content">
            <!-- Vertical navigator -->
            <nav class="navbar sticky-top float-end ms-2 py-0 d-none d-xl-block" id="navbar-vertical">
                <ul class="nav flex-column gap-2 navbar-icons">
                    <li class="nav-item shadow-sm rounded-circle">
                        <a class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center p-3 bi bi-house-fill home-link" href="#home" data-bs-toggle="tooltip"
                            data-bs-placement="left" title="" data-i18n-attr="title:home.homeTooltip"></a>
                    </li>
                    <li class="nav-item shadow-sm rounded-circle">
                        <a class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center p-3 bi bi-person-fill about-me-link" href="#about-me" data-bs-toggle="tooltip"
                            data-bs-placement="left" title="" data-i18n-attr="title:home.aboutTooltip"></a>
                    </li>
                    <li class="nav-item shadow-sm rounded-circle">
                        <a class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center p-3 bi bi-pc-display-horizontal experience-studies-link" href="#jobs-studies"
                            data-bs-toggle="tooltip" data-bs-placement="left" title=""
                            data-i18n-attr="title:home.experienceStudiesTooltip"></a>
                    </li>
                    <li class="nav-item shadow-sm rounded-circle">
                        <a class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center p-3 bi bi-hand-thumbs-up-fill skills-link" href="#skills"
                            data-bs-toggle="tooltip" data-bs-placement="left" title=""
                            data-i18n-attr="title:home.skillsTooltip"></a>
                    </li>
                    <li class="nav-item shadow-sm rounded-circle">
                        <a class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center p-3 bi bi-hammer projects-link" href="#projects" data-bs-toggle="tooltip"
                            data-bs-placement="left" title="" data-i18n-attr="title:home.projectsTooltip"></a>
                    </li>
                    <li class="nav-item shadow-sm rounded-circle">
                        <a class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center p-3 bi bi-file-text-fill courses-certificates-link" href="#courses"
                            data-bs-toggle="tooltip" data-bs-placement="left" title=""
                            data-i18n-attr="title:home.coursesTooltip"></a>
                    </li>
                </ul>
            </nav>

            <!-- Content -->
            <section class="section card border-0 shadow-lg rounded-4 p-4 p-lg-5" id="about-me">
                <h1 class="display-6 fw-bold mb-4 about-me-header" data-i18n="home.aboutTitle"></h1>
                <div class="row align-items-center g-4">
                    <div class="col-12 col-lg-3 text-center">
                        <img src="./assets/images/profile.jpg" class="img-fluid rounded-circle border border-4 border-white shadow" id="profile-image"
                            alt="" data-i18n-attr="alt:site.profileImageAlt" />
                        <div class="mt-4 navbar-icons d-flex justify-content-center gap-2">
                            <a class="btn btn-light rounded-circle shadow-sm link-dark bi bi-linkedin" href="https://www.linkedin.com/in/losedavidpb/"
                                target="_blank" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Linkedin">
                            </a>
                            <a class="btn btn-light rounded-circle shadow-sm link-dark bi bi-github" href="https://github.com/losedavidpb" target="_blank"
                                data-bs-toggle="tooltip" data-bs-placement="bottom" title="GitHub">
                            </a>
                            <a class="btn btn-light rounded-circle shadow-sm link-dark bi bi-envelope-fill" href="mailto:losedavidpb@gmail.com"
                                target="_blank" data-bs-toggle="tooltip" data-bs-placement="bottom" title=""
                                data-i18n-attr="title:site.mailLabel">
                            </a>
                        </div>
                    </div>
                    <div class="col-12 col-lg-9 fs-5 lh-lg">
                        <p class="fw-bold fs-3 text-dark mb-3 introduction-title" data-i18n="home.introductionTitle"></p>
                        <div class="text-secondary text-justify introduction-content" data-i18n-list="home.introduction"></div>
                    </div>
                </div>
            </section>
            <section class="section card border-0 shadow-lg rounded-4 mt-4 p-4 p-lg-5" id="jobs-studies">
                <section>
                    <h2 class="fw-bold border-bottom pb-3 mb-4 experience-header" data-i18n="home.experienceTitle"></h2>
                    <ul class="list-unstyled mb-5" id="job-list" data-content="jobs"></ul>
                </section>
                <section>
                    <h2 class="fw-bold border-bottom pb-3 mb-4 studies-header" data-i18n="home.studiesTitle"></h2>
                    <ul class="list-unstyled mb-0" id="study-list" data-content="studies"></ul>
                </section>
            </section>
            <section class="section card border-0 shadow-lg rounded-4 mt-4 p-4 p-lg-5" id="skills">
                <div>
                    <h2 class="fw-bold border-bottom pb-3 mb-4 skills-header" data-i18n="home.skillsTitle"></h2>
                    <div>
                        <ul class="list-unstyled mb-0" id="skill-list" data-content="skills"></ul>
                    </div>
                </div>
            </section>
            <section class="section card border-0 shadow-lg rounded-4 mt-4 p-4 p-lg-5" id="projects">
                <div>
                    <h2 class="fw-bold border-bottom pb-3 mb-4 projects-header" data-i18n="home.projectsTitle"></h2>
                    <ul class="list-unstyled mb-0" id="project-list" data-content="projects"></ul>
                </div>
            </section>
            <section class="section card border-0 shadow-lg rounded-4 my-4 p-4 p-lg-5" id="courses">
                <div>
                    <h2 class="fw-bold border-bottom pb-3 mb-4 courses-certificates-header" data-i18n="home.coursesTitle"></h2>
                    <ul class="list-unstyled mb-0" id="course-list" data-content="courses"></ul>
                </div>
            </section>
        </div>
    </div>
</body>

</html>
