<!DOCTYPE html>
<html lang="en" data-environment="development">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title data-i18n="site.title"></title>
    <meta name="description" content="" data-i18n-attr="content:site.description" />
    <meta name="author" content="" data-i18n-attr="content:site.author" />

    <link rel="canonical" href="" />

    <link rel="alternate" hreflang="es" href="" />
    <link rel="alternate" hreflang="en" href="" />
    <link rel="alternate" hreflang="x-default" href="" />

    <meta name="google-site-verification" content="JOO4joSA4NevMASQPV2XWKz10Mcm7z_lpbDb0yRkDKk" />

    <link rel="icon" type="image/x-icon" href="./assets/images/favicon.ico">

    <!-- https://www.bootstrapcdn.com/ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <!-- https://www.bootstrapcdn.com/bootstrapicons/ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.2/font/bootstrap-icons.css"
        integrity="sha384-b6lVK+yci+bfDmaY1u0zE8YYJt0TZxLEAFyYSLHId4xoVvsrQu3INevFKo+Xir8e" crossorigin="anonymous">

    <link rel="stylesheet" href="./assets/css/style.css">

    <!-- https://developers.google.com/speed/libraries -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>

    <!-- https://www.bootstrapcdn.com/ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous">
        </script>

    <!-- local -->
    <script type="module" src="./assets/js/main.js"></script>
</head>

<body class="bg-light text-dark">
    <div class="background" id="background-image">

        <!-- Language selector -->
        <div class="list-group list-group-horizontal position-absolute top-0 start-0 m-4 shadow-sm rounded-3 overflow-hidden" id="language-div">
            <a class="list-group-item list-group-item-action flex-fill border-0 px-3 py-2" href="?lang=es" data-language="es">
                <span class="fw-bold">ES</span>
            </a>
            <a class="list-group-item list-group-item-action flex-fill border-0 px-3 py-2" href="?lang=en" data-language="en">
                <span class="fw-bold">EN</span>
            </a>
        </div>

        <!-- Header -->
        <header class="container mt-5 pt-5 pb-3 d-flex align-items-center justify-content-between" id="home">
            <div class="d-inline-flex align-items-center px-4 py-3 bg-white border shadow-lg rounded-4">
                <span class="text-dark fs-1 fw-bold person-header" data-i18n="site.name"></span>
            </div>
        </header>

        <!-- Loading spinner -->
        <div id="loader"
            class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center fade show background-spinner">
            <div class="bg-white rounded-4 shadow-lg d-flex flex-column align-items-center loader-box">
                <div class="spinner-border text-primary mb-4 spinner-xl" role="status"></div>
                <span class="text-primary fw-semibold loader-text" id="loading-text" data-i18n="site.loading"></span>
            </div>
        </div>

        <!-- Main content -->
        <div class="container py-4" id="main-content">
            <!-- Vertical navigator -->
            <nav class="navbar sticky-top float-end ms-2 py-0 d-none d-xl-block" id="navbar-vertical">
                <ul class="nav flex-column gap-2 navbar-icons">
                    <li class="nav-item shadow-sm rounded-circle">
                        <a class="section-shortcut btn btn-primary rounded-circle d-flex align-items-center justify-content-center p-3 bi bi-house-fill home-link" href="#home" data-bs-toggle="tooltip"
                            data-bs-placement="left" title="" aria-label="" data-i18n-attr="aria-label:home.homeTooltip"></a>
                    </li>
                    <li class="nav-item shadow-sm rounded-circle">
                        <a class="section-shortcut btn btn-primary rounded-circle d-flex align-items-center justify-content-center p-3 bi bi-person-fill about-me-link" href="#about-me" data-bs-toggle="tooltip"
                            data-bs-placement="left" title="" aria-label="" data-i18n-attr="aria-label:home.aboutTooltip"></a>
                    </li>
                    <li class="nav-item shadow-sm rounded-circle">
                        <a class="section-shortcut btn btn-primary rounded-circle d-flex align-items-center justify-content-center p-3 bi bi-pin-angle-fill featured-link-nav" href="#featured"
                            data-bs-toggle="tooltip" data-bs-placement="left" title="" aria-label=""
                            data-i18n-attr="aria-label:home.featuredTooltip"></a>
                    </li>
                    <li class="nav-item shadow-sm rounded-circle">
                        <a class="section-shortcut btn btn-primary rounded-circle d-flex align-items-center justify-content-center p-3 bi bi-briefcase-fill experience-link" href="#jobs-studies"
                            data-bs-toggle="tooltip" data-bs-placement="left" title="" aria-label=""
                            data-i18n-attr="aria-label:home.experienceTooltip"></a>
                    </li>
                    <li class="nav-item shadow-sm rounded-circle">
                        <a class="section-shortcut btn btn-primary rounded-circle d-flex align-items-center justify-content-center p-3 bi bi-mortarboard-fill studies-link" href="#studies"
                            data-bs-toggle="tooltip" data-bs-placement="left" title="" aria-label=""
                            data-i18n-attr="aria-label:home.studiesTooltip"></a>
                    </li>
                    <li class="nav-item shadow-sm rounded-circle">
                        <a class="section-shortcut btn btn-primary rounded-circle d-flex align-items-center justify-content-center p-3 bi bi-hand-thumbs-up-fill skills-link" href="#skills"
                            data-bs-toggle="tooltip" data-bs-placement="left" title="" aria-label=""
                            data-i18n-attr="aria-label:home.skillsTooltip"></a>
                    </li>
                    <li class="nav-item shadow-sm rounded-circle">
                        <a class="section-shortcut btn btn-primary rounded-circle d-flex align-items-center justify-content-center p-3 bi bi-hammer projects-link" href="#projects" data-bs-toggle="tooltip"
                            data-bs-placement="left" title="" aria-label="" data-i18n-attr="aria-label:home.projectsTooltip"></a>
                    </li>
                    <li class="nav-item shadow-sm rounded-circle">
                        <a class="section-shortcut btn btn-primary rounded-circle d-flex align-items-center justify-content-center p-3 bi bi-file-text-fill courses-certificates-link" href="#courses"
                            data-bs-toggle="tooltip" data-bs-placement="left" title="" aria-label=""
                            data-i18n-attr="aria-label:home.coursesTooltip"></a>
                    </li>
                </ul>
            </nav>

            <!-- Mobile navigator -->
            <button class="btn btn-primary position-fixed bottom-0 end-0 m-3 rounded-circle shadow-lg d-xl-none mobile-nav-button"
                id="mobile-nav-button" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobile-section-nav"
                aria-controls="mobile-section-nav" aria-label="" data-i18n-attr="aria-label:site.openNavigation">
                <i class="bi bi-list fs-3" aria-hidden="true"></i>
            </button>
            <aside class="offcanvas offcanvas-end" tabindex="-1" id="mobile-section-nav" aria-labelledby="mobile-section-nav-title">
                <div class="offcanvas-header border-bottom">
                    <h2 class="offcanvas-title h5 fw-bold" id="mobile-section-nav-title" data-i18n="site.navigationTitle"></h2>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label=""
                        data-i18n-attr="aria-label:site.closeNavigation"></button>
                </div>
                <nav class="offcanvas-body p-3" aria-label="" data-i18n-attr="aria-label:site.navigationLabel">
                    <div class="list-group list-group-flush rounded-3 overflow-hidden">
                        <a class="section-shortcut list-group-item list-group-item-action d-flex align-items-center gap-3 py-3" href="#home"
                            data-bs-dismiss="offcanvas" data-bs-target="#mobile-section-nav">
                            <i class="bi bi-house-fill text-primary" aria-hidden="true"></i><span data-i18n="home.homeTooltip"></span>
                        </a>
                        <a class="section-shortcut list-group-item list-group-item-action d-flex align-items-center gap-3 py-3" href="#about-me"
                            data-bs-dismiss="offcanvas" data-bs-target="#mobile-section-nav">
                            <i class="bi bi-person-fill text-primary" aria-hidden="true"></i><span data-i18n="home.aboutTooltip"></span>
                        </a>
                        <a class="section-shortcut list-group-item list-group-item-action d-flex align-items-center gap-3 py-3" href="#featured"
                            data-bs-dismiss="offcanvas" data-bs-target="#mobile-section-nav">
                            <i class="bi bi-pin-angle-fill text-primary" aria-hidden="true"></i><span data-i18n="home.featuredTooltip"></span>
                        </a>
                        <a class="section-shortcut list-group-item list-group-item-action d-flex align-items-center gap-3 py-3" href="#jobs-studies"
                            data-bs-dismiss="offcanvas" data-bs-target="#mobile-section-nav">
                            <i class="bi bi-briefcase-fill text-primary" aria-hidden="true"></i><span data-i18n="home.experienceTooltip"></span>
                        </a>
                        <a class="section-shortcut list-group-item list-group-item-action d-flex align-items-center gap-3 py-3" href="#studies"
                            data-bs-dismiss="offcanvas" data-bs-target="#mobile-section-nav">
                            <i class="bi bi-mortarboard-fill text-primary" aria-hidden="true"></i><span data-i18n="home.studiesTooltip"></span>
                        </a>
                        <a class="section-shortcut list-group-item list-group-item-action d-flex align-items-center gap-3 py-3" href="#skills"
                            data-bs-dismiss="offcanvas" data-bs-target="#mobile-section-nav">
                            <i class="bi bi-hand-thumbs-up-fill text-primary" aria-hidden="true"></i><span data-i18n="home.skillsTooltip"></span>
                        </a>
                        <a class="section-shortcut list-group-item list-group-item-action d-flex align-items-center gap-3 py-3" href="#projects"
                            data-bs-dismiss="offcanvas" data-bs-target="#mobile-section-nav">
                            <i class="bi bi-hammer text-primary" aria-hidden="true"></i><span data-i18n="home.projectsTooltip"></span>
                        </a>
                        <a class="section-shortcut list-group-item list-group-item-action d-flex align-items-center gap-3 py-3" href="#courses"
                            data-bs-dismiss="offcanvas" data-bs-target="#mobile-section-nav">
                            <i class="bi bi-file-text-fill text-primary" aria-hidden="true"></i><span data-i18n="home.coursesTooltip"></span>
                        </a>
                    </div>
                </nav>
            </aside>

            <!-- Content -->
            <section class="section card border-0 shadow-lg rounded-4 p-4 p-lg-5" id="about-me">
                <h1 class="display-6 fw-bold mb-4 about-me-header" data-i18n="home.aboutTitle"></h1>
                <div class="row align-items-center g-4">
                    <div class="col-12 col-lg-3 text-center">
                        <a class="profile-link" href="https://www.linkedin.com/in/losedavidpb/" target="_blank" rel="noopener noreferrer">
                            <img src="./assets/images/profile.jpg" class="img-fluid rounded-circle border border-4 border-white shadow"
                                id="profile-image" width="190" height="190" decoding="async" fetchpriority="high" alt=""
                                data-i18n-attr="alt:site.profileImageAlt" />
                        </a>
                        <div class="mt-4 navbar-icons d-flex justify-content-center gap-2">
                            <a class="btn btn-light rounded-circle shadow-sm link-dark bi bi-linkedin" href="https://www.linkedin.com/in/losedavidpb/"
                                target="_blank" rel="noopener noreferrer" data-bs-toggle="tooltip" data-bs-placement="bottom" title="LinkedIn" aria-label="LinkedIn">
                            </a>
                            <a class="btn btn-light rounded-circle shadow-sm link-dark bi bi-github" href="https://github.com/losedavidpb" target="_blank" rel="noopener noreferrer"
                                data-bs-toggle="tooltip" data-bs-placement="bottom" title="GitHub" aria-label="GitHub">
                            </a>
                            <a class="btn btn-light rounded-circle shadow-sm link-dark bi bi-envelope-fill" href="mailto:losedavidpb@gmail.com"
                                data-bs-toggle="tooltip" data-bs-placement="bottom" title="" aria-label="" data-i18n-attr="aria-label:site.mailLabel">
                            </a>
                        </div>
                    </div>
                    <div class="col-12 col-lg-9 fs-5 lh-lg">
                        <p class="fw-bold fs-3 text-dark mb-3 introduction-title" data-i18n="home.introductionTitle"></p>
                        <div class="text-secondary text-justify introduction-content" data-i18n-list="home.introduction"></div>
                    </div>
                </div>
            </section>
            <section class="section card border-0 shadow-lg rounded-4 mt-4 p-4 p-lg-5" id="featured">
                <h2 class="fw-bold border-bottom pb-3 mb-4 featured-header" data-i18n="home.featuredTitle"></h2>
                <div class="row g-3" id="featured-list" data-content="featured"></div>
            </section>
            <section class="section card border-0 shadow-lg rounded-4 mt-4 p-4 p-lg-5" id="jobs-studies">
                <h2 class="fw-bold border-bottom pb-3 mb-4">
                    <button class="section-toggle" type="button" data-bs-toggle="collapse"
                        data-bs-target="#jobs-content" aria-expanded="true" aria-controls="jobs-content">
                        <span class="experience-header" data-i18n="home.experienceTitle"></span>
                        <i class="bi bi-chevron-down" aria-hidden="true"></i>
                    </button>
                </h2>
                <div class="collapse show section-collapse" id="jobs-content">
                    <ul class="list-unstyled mb-0" id="job-list" data-content="jobs"></ul>
                </div>
            </section>
            <section class="section card border-0 shadow-lg rounded-4 mt-4 p-4 p-lg-5" id="studies">
                <h2 class="fw-bold border-bottom pb-3 mb-4">
                    <button class="section-toggle" type="button" data-bs-toggle="collapse"
                        data-bs-target="#studies-content" aria-expanded="true" aria-controls="studies-content">
                        <span class="studies-header" data-i18n="home.studiesTitle"></span>
                        <i class="bi bi-chevron-down" aria-hidden="true"></i>
                    </button>
                </h2>
                <div class="collapse show section-collapse" id="studies-content">
                    <ul class="list-unstyled mb-0" id="study-list" data-content="studies"></ul>
                </div>
            </section>
            <section class="section card border-0 shadow-lg rounded-4 mt-4 p-4 p-lg-5" id="skills">
                <h2 class="fw-bold border-bottom pb-3 mb-4">
                    <button class="section-toggle" type="button" data-bs-toggle="collapse"
                        data-bs-target="#skills-content" aria-expanded="true" aria-controls="skills-content">
                        <span class="skills-header" data-i18n="home.skillsTitle"></span>
                        <i class="bi bi-chevron-down" aria-hidden="true"></i>
                    </button>
                </h2>
                <div class="collapse show section-collapse" id="skills-content">
                    <div>
                        <ul class="list-unstyled mb-0" id="skill-list" data-content="skills"></ul>
                    </div>
                </div>
            </section>
            <section class="section card border-0 shadow-lg rounded-4 mt-4 p-4 p-lg-5" id="projects">
                <h2 class="fw-bold border-bottom pb-3 mb-4">
                    <button class="section-toggle" type="button" data-bs-toggle="collapse"
                        data-bs-target="#projects-content" aria-expanded="true" aria-controls="projects-content">
                        <span class="projects-header" data-i18n="home.projectsTitle"></span>
                        <i class="bi bi-chevron-down" aria-hidden="true"></i>
                    </button>
                </h2>
                <div class="collapse show section-collapse" id="projects-content">
                    <ul class="list-unstyled mb-0" id="project-list" data-content="projects"></ul>
                </div>
            </section>
            <section class="section card border-0 shadow-lg rounded-4 my-4 p-4 p-lg-5" id="courses">
                <h2 class="fw-bold border-bottom pb-3 mb-4">
                    <button class="section-toggle" type="button" data-bs-toggle="collapse"
                        data-bs-target="#courses-content" aria-expanded="true" aria-controls="courses-content">
                        <span class="courses-certificates-header" data-i18n="home.coursesTitle"></span>
                        <i class="bi bi-chevron-down" aria-hidden="true"></i>
                    </button>
                </h2>
                <div class="collapse show section-collapse" id="courses-content">
                    <ul class="list-unstyled mb-0" id="course-list" data-content="courses"></ul>
                </div>
            </section>
        </div>
    </div>
</body>

</html>
